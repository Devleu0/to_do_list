name: Python Code Check

# 어떤 이벤트가 발생했을 때 이 액션을 실행할지 정의합니다.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # 실행될 운영체제 환경을 지정합니다.
    runs-on: ubuntu-latest

    steps:
    - name: 1. 저장소에서 코드 가져오기 (Checkout)
      uses: actions/checkout@v4

    - name: 2. 파이썬 환경 설정
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # 파이썬 3.10 버전 사용

    - name: 3. 검사 도구(flake8) 설치
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: 4. 코드 문법 검사 실행
      run: |
        # 치명적인 문법 오류나 정의되지 않은 변수 사용 등을 찾아냅니다.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics